<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" fill="none" />

  <!-- Gift & Reward Icon -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Box Body -->
    <rect x="30" y="120" width="240" height="170" rx="24" fill="url(#badge-grad)" />
    
    <!-- Lid -->
    <rect x="15" y="70" width="270" height="50" rx="16" fill="#ffffff" />
    
    <!-- Ribbon Vertical -->
    <rect x="125" y="70" width="50" height="220" fill="#4f46e5" />
    <rect x="135" y="70" width="30" height="220" fill="#6366f1" />
    
    <!-- Ribbon Horizontal on Body -->
    <rect x="30" y="180" width="240" height="34" fill="#4f46e5" fill-opacity="0.15" />

    <!-- Ribbon Bow Loops -->
    <!-- Left Loop -->
    <path d="M150 70 C100 10 50 20 65 55 C75 80 125 70 150 70 Z" fill="#6366f1" />
    <path d="M145 68 C110 25 70 32 80 55 C90 70 130 68 145 68 Z" fill="#4f46e5" />
    
    <!-- Right Loop -->
    <path d="M150 70 C200 10 250 20 235 55 C225 80 175 70 150 70 Z" fill="#6366f1" />
    <path d="M155 68 C190 25 230 32 220 55 C210 70 170 68 155 68 Z" fill="#4f46e5" />
    
    <!-- Bow Knot -->
    <circle cx="150" cy="70" r="22" fill="#ffffff" stroke="#4f46e5" stroke-width="6" />

    <!-- Cashback Dollar / Currency badge -->
    <g transform="translate(190, 190)">
      <circle cx="45" cy="45" r="42" fill="#10b981" stroke="#ffffff" stroke-width="6" />
      <path d="M45 24V66M55 34C55 34 35 30 35 42C35 54 55 52 55 60C55 68 35 66 35 66" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
